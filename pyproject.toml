[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "riverwatch-nepal"
version = "0.1.0"
description = "Cloud-native near-real-time river monitoring and analytics platform for Nepal"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "tenacity>=9.0,<10.0",
    "pyspark>=4.2,<4.3",
    "duckdb",
    "fastapi",
    "uvicorn",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "respx>=0.21,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "httpx2>=2.0.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.mypy]
python_version = "3.12"
strict = true
packages = ["riverwatch"]